[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deepdeck-agent-sdk"
version = "0.1.0"
description = "Beginner-friendly Python toolkit for Deep Deck League agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Deep Deck League" }]
maintainers = [{ name = "Deep Deck League" }]
keywords = ["agents", "artificial-intelligence", "game-engine", "magic-the-gathering", "sdk"]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "websockets>=14,<16",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://deepdeckleague.com/developers"
Documentation = "https://github.com/dd-the-dd/DeepDeckAgent#readme"
Repository = "https://github.com/dd-the-dd/DeepDeckAgent"
Issues = "https://github.com/dd-the-dd/DeepDeckAgent/issues"

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deepdeck_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["deepdeck_agent"]
